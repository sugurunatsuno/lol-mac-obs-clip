<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBS Mode - LoL Clip Tool</title>
    <script type="module" src="/settings.js" defer></script>
  </head>

  <body>
    <nav class="bg-gray-800 text-gray-100 py-2">
      <div class="container mx-auto flex items-center gap-4">
        <a class="font-bold text-white" href="index.html">Clip Tool</a>
        <a class="hover:text-blue-400" href="index.html">Home</a>
        <a class="hover:text-blue-400" href="obs.html">OBS Mode</a>
        <a class="hover:text-blue-400" href="ffmpeg.html">FFmpeg Mode</a>
        <a class="hover:text-blue-400" href="videos.html">Videos</a>
      </div>
    </nav>
    <main class="container mx-auto p-4 app-container">
      <h1 class="mb-4 text-center">LoL イベントトリガー録画アプリ</h1>

      <div class="status-panel mb-3">
        <div><strong>ゲーム状態:</strong> <span id="gameState"></span></div>
        <div><strong>OBS状態:</strong> <span id="obsState"></span></div>
        <div class="form-check form-switch mode-toggle" style="display:none;">
          <input class="form-check-input" type="checkbox" id="modeToggle" />
          <label class="form-check-label" for="modeToggle">シェル録画を使用</label>
        </div>
      </div>

      <div class="button-group mb-4">
        <h2 class="h5 mb-3">🎥 録画操作</h2>
        <button class="px-4 py-2 mr-2 bg-blue-600 text-white rounded" id="btnStart">録画開始</button>
        <button class="px-4 py-2 bg-gray-600 text-white rounded" id="btnStop">録画停止</button>
      </div>

      <div class="button-group mb-4">
        <h2 class="h5 mb-3">🔁 リプレイバッファ</h2>
        <button class="px-4 py-2 mr-2 bg-green-600 text-white rounded" id="btnReplayStart">開始</button>
        <button class="px-4 py-2 mr-2 bg-yellow-500 text-white rounded" id="btnReplayStop">停止</button>
        <button class="px-4 py-2 bg-teal-500 text-white rounded" id="btnReplaySave">保存</button>
      </div>


      <div class="button-group mb-4">
        <h2 class="h5 mb-3">🛠 ユーティリティ</h2>
        <div class="flex mb-2 space-x-2">
          <input class="border rounded p-1 flex-grow" id="saveDirInput" type="text" />
          <button class="px-2 py-1 border border-gray-500 text-gray-700 rounded" id="chooseDirBtn">選択</button>
        </div>
        <button class="px-2 py-1 border border-blue-600 text-blue-600 rounded" id="btnGetDir">保存先を開く</button>
        <button class="px-2 py-1 ml-2 border border-green-600 text-green-600 rounded" id="btnSaveSettings">設定保存</button>
      </div>

      <div class="log-container">
        <h2 class="h5 mb-3">📜 ゲームイベントログ</h2>
        <ul id="eventLog" class="list-unstyled"></ul>
      </div>
    </main>

    <script>window.addEventListener("DOMContentLoaded",()=>{const t=document.getElementById("modeToggle");if(t){t.checked=false;t.disabled=true;}});</script>
  </body>
</html>
