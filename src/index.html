<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>LoL イベントトリガー録画アプリ</h1>

      <div class="status-panel">
        <div><strong>ゲーム状態:</strong> <span id="gameState"></span></div>
        <div><strong>OBS状態:</strong> <span id="obsState"></span></div>
      </div>

      <div class="button-group">
        <h2>🎥 録画操作</h2>
        <button id="btnStart">録画開始</button>
        <button id="btnStop">録画停止</button>
      </div>

      <div class="button-group">
        <h2>🔁 リプレイバッファ</h2>
        <button id="btnReplayStart">開始</button>
        <button id="btnReplayStop">停止</button>
        <button id="btnReplaySave">保存</button>
      </div>

      <div class="button-group">
        <h2>🛠 ユーティリティ</h2>
        <button id="btnGetDir">保存先を開く</button>
      </div>

      <div class="log-container">
        <h2>📜 ゲームイベントログ</h2>
        <ul id="eventLog"></ul>
      </div>
    </main>

  </body>
</html>
